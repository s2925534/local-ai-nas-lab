services:
  ollama:
    image: ollama/ollama:latest
    container_name: localai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - "${LOCAL_AI_BASE_PATH:-./data/local-ai}/ollama:/root/.ollama"
    networks:
      - local_ai_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: localai-open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_BIND_HOST:-0.0.0.0}:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=${WEBUI_NAME:-Local AI NAS}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
    volumes:
      - "${LOCAL_AI_BASE_PATH:-./data/local-ai}/open-webui:/app/backend/data"
    depends_on:
      - ollama
    networks:
      - local_ai_net

networks:
  local_ai_net:
    name: local_ai_net
